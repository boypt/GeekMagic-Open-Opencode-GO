<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Photo Album</title>
    <link rel="stylesheet" href="./css/pico.min.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <!-- Cropper.js：画布裁剪/缩放控件（CDN 引用，不占设备空间） -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>
    <script src="./js/alpinejs.min.js" defer></script>
    <script src="./js/utils.js"></script>
    <script src="./js/themeSwitcher.js"></script>
    <script src="./js/albumUploadHandler.js"></script>
    <script src="./js/main.js"></script>
  </head>
  <body>
    <main class="container">
      <header id="header-placeholder"></header>

      <a href="./index.html" style="margin-left: 2em">← Back to Home</a>
      <section>
        <div x-data="albumUploadHandler()" x-init="init()" style="margin-top: 2em">
          <h2>Photo Album</h2>
          <p>
            <small
              >Images are converted to 240×240 RGB565 in your browser and stored
              raw on the device — the firmware shows them with zero decoding.</small
            >
          </p>
          <form @submit.prevent="uploadImage">
            <input
              type="file"
              x-ref="fileInput"
              required
              accept="image/*"
              multiple
            />
            <button type="submit" x-bind:disabled="uploading">
              Upload selected
            </button>
          </form>
          <template x-if="uploading">
            <span aria-busy="true" style="margin-left: 1em">Uploading...</span>
          </template>
          <p x-text="uploadMessage"></p>

          <!-- 单图交互裁剪（Cropper.js）：拖动构图 / 滚轮缩放 / 旋转 -->
          <template x-if="cropping">
            <div style="margin-top: 1em">
              <p>
                <strong>Crop &amp; scale</strong>
                <small
                  >— 拖动移动、滚轮缩放、旋转构图，输出 240×240</small
                >
              </p>
              <div
                style="
                  max-width: 360px;
                  height: 320px;
                  margin-bottom: 0.5em;
                  background: #111;
                "
              >
                <img x-ref="cropImage" style="max-width: 100%; display: block" />
              </div>
              <div style="display: flex; gap: 0.5em; flex-wrap: wrap">
                <button type="button" @click="rotateCrop(-90)">
                  ↺ Rotate
                </button>
                <button type="button" @click="rotateCrop(90)">
                  ↻ Rotate
                </button>
                <button
                  type="button"
                  class="primary"
                  @click="cropUpload()"
                  x-bind:disabled="uploading"
                >
                  Crop &amp; Upload
                </button>
                <button type="button" @click="cropAuto()" x-bind:disabled="uploading">
                  Auto fit
                </button>
                <button type="button" @click="closeCropper()">Cancel</button>
              </div>
            </div>
          </template>

          <section style="margin-top: 2em">
            <h3>Images on device</h3>
            <div style="margin-bottom: 0.5em; display: flex; gap: 0.5em">
              <button @click="stopPlayback()">Back to Balance</button>
              <button @click="playAll()" title="Play all (auto carousel)">
                Play all
              </button>
            </div>
            <div x-show="listLoaded">
              <p>
                <strong>Used:</strong> <span x-text="usedBytesHR"></span> /
                <strong>Total:</strong>
                <span x-text="totalBytesHR"></span> (<strong>Free:</strong>
                <span x-text="freeBytesHR"></span>)
              </p>
              <template x-if="images.length === 0">
                <p>No images uploaded yet.</p>
              </template>
              <ul>
                <template x-for="img in images" :key="img.name">
                  <li>
                    <span x-text="img.name"></span> (<span
                      x-text="humanFileSize(img.size)"
                    ></span
                    >)
                    <button
                      @click="playImage(img.name)"
                      style="margin-left: 1em"
                      title="Play this image (fixed)"
                    >
                      Play
                    </button>
                    <button
                      @click="deleteImage(img.name)"
                      style="margin-left: 0.5em; color: #b00"
                    >
                      Delete
                    </button>
                  </li>
                </template>
              </ul>
            </div>
            <div x-show="!listLoaded">
              <em>Loading image list...</em>
            </div>
          </section>
        </div>
      </section>

      <footer id="footer-placeholder"></footer>
    </main>
  </body>
</html>
