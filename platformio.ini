; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.ldscript = eagle.flash.4m2m.ld
board_build.filesystem = littlefs
monitor_filters = esp8266_exception_decoder, time, colorize
build_flags =
	-Iinclude
	-DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
	; ESP8266 IROM 只支持 32-bit 访问；没有异常处理器时裸指针解引用（l8ui）会崩
	; Exception(3)。安装非 32-bit 访问兜底处理器（可读但慢，仅作安全网）
	-DNON32XFER_HANDLER
	; 强制包含：u8g2_fonts.c 在非 AVR 平台不带 section 属性且 u8x8_pgm_read 是
	; 裸指针解引用；该头把读取宏改为 pgm_read_byte、字体节重映射到 .irom.text.*
	; （字体放回 flash 省 ~10KB RAM，读取走安全 l32i+移位路径）
	-include opencodego/IromAccess.h
extra_scripts = pre:scripts/git_version.py
check_tool = clangtidy
check_flags = 
	clangtidy: --checks=-*,bugprone-*,modernize-*,readability-*,modernize-use-trailing-return-type,-bugprone-easily-swappable-parameters --warnings-as-errors=*
lib_deps = 
	bblanchon/ArduinoJson@^7.4.2
	moononournation/GFX Library for Arduino@^1.6.4
	bitbank2/AnimatedGIF@^2.2.0
	olikraus/U8g2_for_Adafruit_GFX@^1.8.0
