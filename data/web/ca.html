<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TLS Certificate</title>
    <link rel="stylesheet" href="./css/pico.min.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/alpinejs.min.js" defer></script>
    <script src="./js/utils.js"></script>
    <script src="./js/themeSwitcher.js"></script>
    <script src="./js/caHandler.js"></script>
    <script src="./js/main.js"></script>
  </head>
  <body>
    <main class="container">
      <header id="header-placeholder"></header>

      <a href="./index.html" class="wifi-back-link">← Back to Home</a>

      <section x-data="caHandler()" x-init="init()">
        <h2>TLS Certificate</h2>

        <p>
          <strong>Current source:</strong>
          <span x-text="source === 'custom' ? 'Custom CA' : 'Built-in CA'"></span>
          <template x-if="source">
            <span>
              · <span x-text="bytes"></span> bytes
            </span>
          </template>
        </p>

        <div
          role="status"
          class="ca-status"
          :class="statusSuccess ? 'ca-status-ok' : 'ca-status-error'"
          x-show="statusMessage"
          x-cloak
        >
          <span x-text="statusMessage"></span>
        </div>

        <div class="ca-actions">
          <button
            type="button"
            class="primary"
            @click="savePem()"
            x-bind:disabled="saving || deleting"
          >
            <span x-text="saving ? 'Saving…' : 'Save'"></span>
          </button>
          <button
            type="button"
            class="secondary"
            @click="fetchCa()"
            x-bind:disabled="loading"
          >
            Load current PEM
          </button>
          <button
            type="button"
            class="ca-delete"
            @click="deleteCa()"
            x-bind:disabled="saving || testing || deleting"
          >
            <span
              x-text="confirmDelete
                ? 'Really delete?'
                : deleting
                  ? 'Deleting…'
                  : 'Delete custom CA'"
            ></span>
          </button>
        </div>

        <hr />

        <div class="ca-editor">
          <label for="ca-pem">Root CA PEM</label>
          <textarea
            id="ca-pem"
            class="ca-pem-textarea"
            x-model="pem"
            rows="14"
            spellcheck="false"
            placeholder="-----BEGIN CERTIFICATE-----&#10;...&#10;-----END CERTIFICATE-----"
            x-bind:disabled="saving || deleting"
          ></textarea>
          <p>
            <small>
              Paste a root certificate in PEM format (custom CA) to enable HTTPS
              certificate verification. Without a configured CA the firmware does
              not verify certificates (insecure).
            </small>
          </p>
        </div>

      </section>

      <footer id="footer-placeholder"></footer>
    </main>
  </body>
</html>
