<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenCode Go</title>
    <link rel="stylesheet" href="./css/pico.min.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/alpinejs.min.js" defer></script>
    <script src="./js/utils.js"></script>
    <script src="./js/themeSwitcher.js"></script>
    <script src="./js/opencodegoHandler.js"></script>
    <script src="./js/main.js"></script>
  </head>
  <body>
    <main class="container">
      <header id="header-placeholder"></header>

      <a href="./index.html" class="wifi-back-link">← Back to Home</a>

      <section x-data="opencodegoHandler()" x-init="init()">
        <h2>OpenCode Go Usage</h2>

        <div class="opencodego-config">
          <h3>Configuration</h3>
          <label for="ocg-host">API Host</label>
          <input
            id="ocg-host"
            type="text"
            x-model="host"
            autocomplete="off"
            placeholder="opencode.ai"
          />
          <label for="ocg-path">API Path</label>
          <input
            id="ocg-path"
            type="text"
            x-model="path"
            autocomplete="off"
            placeholder="/zen/go/v1/usage"
          />
          <label for="ocg-key">API Key</label>
          <input
            id="ocg-key"
            type="password"
            x-model="apiKey"
            autocomplete="off"
            placeholder="Paste new key here (leave empty to keep current)"
          />
          <small x-text="apiKeyConfigured ? 'Current key: ' + maskedKey : 'No key configured'"></small>
          <label style="margin-top: 0.5em">
            <input type="checkbox" x-model="verifyTls" />
            Verify TLS certificate (GTS Root R4)
          </label>
          <div class="action-row">
            <button
              type="button"
              @click="saveConfig()"
              :disabled="loading"
              aria-busy="loading"
            >
              <span x-show="!loading">Save</span>
              <span x-show="loading" x-cloak>Saving…</span>
            </button>
          </div>
          <p
            class="opencodego-status"
            :class="saveSuccess ? 'success' : 'error'"
            role="status"
            x-show="saveMessage"
            x-cloak
            x-text="saveMessage"
          ></p>
        </div>
      </section>

      <footer id="footer-placeholder"></footer>
    </main>
  </body>
</html>
